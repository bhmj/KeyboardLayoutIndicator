name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish win-x64 (Native AOT)
        run: >
          dotnet publish KeyboardLayoutIndicator.csproj
          -c Release
          -r win-x64
          -o publish
